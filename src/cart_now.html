<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | FreshBite Fruits</title>
  <link rel="stylesheet" href="./output.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="min-h-screen bg-emerald-50 text-gray-800">
  <header class="bg-white shadow-sm">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-600">FreshBite Fruits</a>
      <a href="index.html#products" class="rounded-lg px-3 py-2 font-semibold text-emerald-700 hover:bg-emerald-50"><i class="fa-solid fa-arrow-left mr-2"></i>Continue shopping</a>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-10">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-3">
      <div><p class="mb-1 font-semibold uppercase tracking-widest text-emerald-600">Fresh from the farm</p><h1 class="text-4xl font-extrabold text-gray-900">Your shopping cart</h1></div>
      <p id="cart-count" class="rounded-full bg-white px-4 py-2 font-semibold text-gray-600 shadow-sm">0 items</p>
    </div>
    <div class="grid gap-8 lg:grid-cols-3">
      <section class="lg:col-span-2" aria-labelledby="products-heading">
        <div class="rounded-2xl bg-white p-6 shadow-sm">
          <div class="mb-5 flex items-center justify-between"><h2 id="products-heading" class="text-xl font-bold text-gray-900">Add fresh fruit</h2><span class="text-sm text-gray-500">Tap an item to add it</span></div>
          <div id="product-list" class="grid gap-3 sm:grid-cols-2"></div>
        </div>
        <div class="mt-8 rounded-2xl bg-white p-6 shadow-sm" aria-live="polite">
          <div class="mb-5 flex items-center justify-between"><h2 class="text-xl font-bold text-gray-900">Cart items</h2><button id="clear-cart" type="button" class="hidden text-sm font-semibold text-red-600 hover:text-red-700">Clear cart</button></div>
          <div id="cart-items" class="divide-y divide-gray-100"></div>
          <div id="empty-cart" class="rounded-xl border border-dashed border-emerald-200 bg-emerald-50 px-5 py-10 text-center"><i class="fa-solid fa-basket-shopping mb-3 text-3xl text-emerald-500"></i><p class="font-semibold text-gray-800">Your cart is empty</p><p class="mt-1 text-sm text-gray-500">Choose something delicious from the list above.</p></div>
        </div>
      </section>
      <aside class="h-fit rounded-2xl bg-white p-6 shadow-sm lg:sticky lg:top-6" aria-labelledby="summary-heading">
        <h2 id="summary-heading" class="text-xl font-bold text-gray-900">Order summary</h2>
        <dl class="mt-6 space-y-4 text-gray-600">
          <div class="flex justify-between"><dt>Subtotal</dt><dd id="subtotal" class="font-semibold text-gray-900">₹0.00</dd></div>
          <div class="flex justify-between"><dt>Delivery</dt><dd id="delivery" class="font-semibold text-gray-900">₹0.00</dd></div>
          <div class="border-t border-gray-200 pt-4 text-lg font-bold text-gray-900"><div class="flex justify-between"><dt>Total</dt><dd id="total-price">₹0.00</dd></div></div>
        </dl>
        <p class="mt-5 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-800"><i class="fa-solid fa-truck mr-2"></i>Free delivery on orders over ₹500.</p>
        <button id="checkout-btn" type="button" disabled class="mt-6 w-full rounded-lg bg-emerald-600 px-4 py-3 font-bold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-gray-300">Checkout securely</button>
        <p id="checkout-message" class="mt-3 hidden text-center text-sm font-semibold text-emerald-700" role="status"></p>
      </aside>
    </div>
  </main>
  <script>
    const products = [
      { id: 1, name: "Organic Gala Apples", size: "1 kg", price: 200, icon: "🍎" },
      { id: 2, name: "Alphonso Mangoes", size: "Set of 3", price: 500, icon: "🥭" },
      { id: 3, name: "Fresh Strawberries", size: "250 g punnet", price: 150, icon: "🍓" },
      { id: 4, name: "Navel Oranges", size: "1 kg bag", price: 250, icon: "🍊" },
      { id: 5, name: "Ripe Bananas", size: "1 dozen", price: 100, icon: "🍌" }
    ];
    const storageKey = "freshbite-cart";
    let cart = JSON.parse(localStorage.getItem(storageKey) || "[]");
    const currency = value => `₹${value.toFixed(2)}`;
    const productList = document.getElementById("product-list");
    const cartItems = document.getElementById("cart-items");
    const emptyCart = document.getElementById("empty-cart");
    const checkoutButton = document.getElementById("checkout-btn");
    const checkoutMessage = document.getElementById("checkout-message");
    productList.innerHTML = products.map(product => `
      <button type="button" data-add="${product.id}" class="flex items-center gap-3 rounded-xl border border-gray-100 p-4 text-left transition hover:border-emerald-300 hover:bg-emerald-50">
        <span class="grid h-11 w-11 place-items-center rounded-full bg-emerald-100 text-2xl">${product.icon}</span><span class="min-w-0 flex-1"><span class="block truncate font-bold text-gray-900">${product.name}</span><span class="block text-sm text-gray-500">${product.size}</span></span><span class="font-bold text-emerald-700">${currency(product.price)}</span>
      </button>`).join("");
    function saveCart() { localStorage.setItem(storageKey, JSON.stringify(cart)); }
    function renderCart() {
      const quantity = cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const delivery = subtotal === 0 || subtotal >= 500 ? 0 : 40;
      document.getElementById("cart-count").textContent = `${quantity} ${quantity === 1 ? "item" : "items"}`;
      document.getElementById("subtotal").textContent = currency(subtotal);
      document.getElementById("delivery").textContent = delivery ? currency(delivery) : "Free";
      document.getElementById("total-price").textContent = currency(subtotal + delivery);
      emptyCart.classList.toggle("hidden", cart.length > 0);
      document.getElementById("clear-cart").classList.toggle("hidden", cart.length === 0);
      checkoutButton.disabled = cart.length === 0;
      cartItems.innerHTML = cart.map(item => `
        <article class="flex items-center gap-3 py-4"><span class="grid h-11 w-11 place-items-center rounded-full bg-emerald-100 text-2xl">${item.icon}</span><div class="min-w-0 flex-1"><h3 class="truncate font-bold text-gray-900">${item.name}</h3><p class="text-sm text-gray-500">${item.size} · ${currency(item.price)} each</p></div><div class="flex items-center rounded-lg border border-gray-200"><button type="button" data-change="${item.id}" data-delta="-1" class="px-3 py-2 font-bold text-gray-600 hover:bg-gray-50" aria-label="Decrease ${item.name} quantity">−</button><span class="min-w-8 text-center font-bold">${item.quantity}</span><button type="button" data-change="${item.id}" data-delta="1" class="px-3 py-2 font-bold text-gray-600 hover:bg-gray-50" aria-label="Increase ${item.name} quantity">+</button></div><div class="w-20 text-right"><p class="font-bold text-gray-900">${currency(item.price * item.quantity)}</p><button type="button" data-remove="${item.id}" class="mt-1 text-xs font-semibold text-red-600 hover:text-red-700">Remove</button></div></article>`).join("");
      saveCart();
    }
    productList.addEventListener("click", event => {
      const button = event.target.closest("[data-add]"); if (!button) return;
      const product = products.find(item => item.id === Number(button.dataset.add));
      const existing = cart.find(item => item.id === product.id);
      existing ? existing.quantity += 1 : cart.push({ ...product, quantity: 1 });
      checkoutMessage.classList.add("hidden"); renderCart();
    });
    cartItems.addEventListener("click", event => {
      const change = event.target.closest("[data-change]"); const remove = event.target.closest("[data-remove]");
      if (change) { const item = cart.find(product => product.id === Number(change.dataset.change)); item.quantity += Number(change.dataset.delta); if (item.quantity <= 0) cart = cart.filter(product => product.id !== item.id); }
      if (remove) cart = cart.filter(product => product.id !== Number(remove.dataset.remove));
      if (change || remove) renderCart();
    });
    document.getElementById("clear-cart").addEventListener("click", () => { cart = []; renderCart(); });
    checkoutButton.addEventListener("click", () => { cart = []; renderCart(); checkoutMessage.textContent = "Thanks! Your order has been placed successfully."; checkoutMessage.classList.remove("hidden"); });
    renderCart();
  </script>
</body>
</html>
